# Infrastructure only — no pipeline business logic in this file.
# All services load environment from the repo-root .env only (never backend/.env or frontend/.env).
# Create/validate .env via: make check

services:
  frontend:
    image: oven/bun:1.3
    working_dir: /workspace/frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Paths inside the container (repo mounted at /workspace)
      SQFT_DATA_DIR: /workspace/data
    volumes:
      - .:/workspace
    command: ["sh", "-c", "bun install && bun run dev --hostname 0.0.0.0"]
    profiles:
      - default

  frontend-debug:
    image: oven/bun:1.3
    working_dir: /workspace/frontend
    ports:
      - "3000:3000"
      - "9229:9229"
    env_file:
      - .env
    environment:
      SQFT_DATA_DIR: /workspace/data
      NODE_OPTIONS: --inspect=0.0.0.0:9229
    volumes:
      - .:/workspace
    command: ["sh", "-c", "bun install && bun run dev --hostname 0.0.0.0"]
    profiles:
      - debug
